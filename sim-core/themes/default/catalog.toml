# ---------------------------------------------------------------- recipes
# Generic establishment work orders use this data, never bespoke profession code.
[recipes.carpenter_tool]
workplace = "workshop"
inputs = { timber = 1 }
output = "tools"
output_qty = 1
labor_hours = 8.0

# A supply chain is expressed as ordinary recipe output and custody transfer.
# Hunting supplies meat; butcher_shop turns it into a storable food input; restaurant
# turns that input into a perishable prepared meal. Markets distribute either product
# through the ordinary trade primitive rather than a bespoke market-production path.
[recipes.butcher_portion]
workplace = "butcher_shop"
inputs = { meat = 10 }
output = "butchered_meat"
output_qty = 9
labor_hours = 8.0

[recipes.restaurant_meal]
workplace = "restaurant"
inputs = { butchered_meat = 3 }
output = "meal"
output_qty = 3
labor_hours = 8.0

# Salt is a genuine upstream input: preservation improves shelf life, then the
# resulting food can be sold in markets or cooked at restaurants.
[recipes.butcher_preserve]
workplace = "butcher_shop"
inputs = { meat = 10, salt = 1 }
output = "preserved_meat"
output_qty = 9
labor_hours = 8.0

[recipes.restaurant_preserved_meal]
workplace = "restaurant"
inputs = { preserved_meat = 3 }
output = "meal"
output_qty = 3
labor_hours = 8.0

[recipes.smith_tools]
workplace = "smithy"
inputs = { iron_ore = 2, coal = 1 }
output = "tools"
output_qty = 1
labor_hours = 8.0

# ---------------------------------------------------------------- crops (ECOLOGY)
[crops]
grain = { item = "grain", plant_season = "spring", harvest_season = "autumn", growth_days = 150, moisture_min = 0.15, moisture_optimal = 0.5, moisture_max = 0.9, yield_kg_per_ha = 800.0, hectares_per_field = 4.0, frost_loss = 0.3, stress_loss_per_day = 0.003 }
# stress_loss_per_day: yield lost per fully moisture-stressed day (dry or waterlogged), x (1 - moisture factor).
# worldgen-v1 finding: the former hardcoded 0.015 compounded over a 180-day season to 0.15-0.35 health on every
# farm (moisture is never exactly optimal), so one farm fed two people and a household of four starved.
# 0.003 ~ a 60-day full drought costs 17% of yield. Provisional, not an agronomic calibration.

# ---------------------------------------------------------------- wildlife (statistical, per cell)
# r per day; k_per_km2 at vegetation = 1; raids = eats standing crops
[wildlife]
game     = { r = 0.002, k_per_km2 = 20.0, diet = ["vegetation"], raids = false, hunt_yield_kg = 40.0 }
raider   = { r = 0.004, k_per_km2 = 60.0, diet = ["vegetation", "crops"], raids = true, hunt_yield_kg = 8.0 }
predator = { r = 0.001, k_per_km2 = 2.0,  diet = ["game", "livestock"], raids = false, hunt_yield_kg = 15.0 }

# ---------------------------------------------------------------- disease (ECOLOGY)
# hosts: wildlife ids, livestock item ids, or "people"; cross-species only where listed
[disease.murrain]
hosts = ["game", "cattle", "sheep"]
routes = ["contact", "water"]
beta = { game = 0.3, cattle = 0.2, sheep = 0.2 }
cross = { "game>cattle" = 0.05, "game>sheep" = 0.05, "cattle>sheep" = 0.1 }
incubation_days = 5
infectious_days = 10
mortality = { game = 0.4, cattle = 0.3, sheep = 0.3 }
immunity = true
effects = { work = 0.5, production = 0.3 }
symptoms = ["stops eating", "staggering"]

[disease.grey_cough]
hosts = ["people"]
routes = ["contact"]
beta = { people = 0.15 }
cross = {}
incubation_days = 4
infectious_days = 12
mortality = { people = 0.08 }
immunity = true
effects = { work = 0.3, production = 0.0 }
symptoms = ["fever", "cough", "grey pallor"]
