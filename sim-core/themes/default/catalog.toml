# Chronicle — default theme catalog v1. The engine reads FIELDS, never ids.
# Weights kg, rates per day, prices in coin. Themes rename/reprice freely.

[theme]
name = "default"
chronicler_voice = "plain annalist"

# ---------------------------------------------------------------- roles (ERRATA 2.6)
# workplace: building id or "none"; requires: capability ids; produces: item ids
[roles]
farmer       = { workplace = "farm",      requires = [], produces = ["grain"],          role_weight = 0.0, enforcement = false }
herder       = { workplace = "pasture",   requires = [], produces = ["milk", "hide"],   role_weight = 0.0, enforcement = false }
fisher       = { workplace = "fishery",   requires = [], produces = ["fish"],           role_weight = 0.0, enforcement = false }
hunter       = { workplace = "hunters_cabin", requires = [], produces = ["meat", "hide"],   role_weight = 0.1, enforcement = false }
butcher      = { workplace = "butcher_shop",  requires = [], produces = ["butchered_meat"],    role_weight = 0.2, enforcement = false }
chef         = { workplace = "restaurant",    requires = [], produces = ["meal"],              role_weight = 0.3, enforcement = false }
# Distinct extraction roles/workplaces are catalog data.  Their physical output is
# declared by the workplace `extracts` table below, not a profession-specific resolver.
iron_miner   = { workplace = "iron_mine", requires = [], produces = ["iron_ore"], role_weight = 0.1, enforcement = false }
coal_miner   = { workplace = "coal_mine", requires = [], produces = ["coal"], role_weight = 0.1, enforcement = false }
salt_miner   = { workplace = "salt_mine", requires = [], produces = ["salt"], role_weight = 0.1, enforcement = false }
quarrier     = { workplace = "quarry", requires = [], produces = ["stone"], role_weight = 0.1, enforcement = false }
# Compatibility role for saved worlds/themes that still use the generic mine.
miner        = { workplace = "mine",      requires = [], produces = ["ore", "stone"],   role_weight = 0.1, enforcement = false }
woodcutter   = { workplace = "woodlot",   requires = [], produces = ["timber"],         role_weight = 0.0, enforcement = false }
crafter      = { workplace = "workshop",  requires = [], produces = ["tools"],          role_weight = 0.1, enforcement = false }
mason        = { workplace = "none",      requires = [], produces = ["stone"],          role_weight = 0.2, enforcement = false }
smith        = { workplace = "smithy",    requires = [], produces = ["tools"],          role_weight = 0.3, enforcement = false }
miller       = { workplace = "mill",      requires = [], produces = ["flour"],          role_weight = 0.3, enforcement = false }
papermaker   = { workplace = "workshop",  requires = [], produces = ["sheet"],          role_weight = 0.2, enforcement = false }
merchant     = { workplace = "market",    requires = [], produces = [],                 role_weight = 0.5, enforcement = false }
courier      = { workplace = "none",      requires = [], produces = [],                 role_weight = 0.2, enforcement = false }
soldier      = { workplace = "none",      requires = [], produces = [],                 role_weight = 0.3, enforcement = false }
enforcer     = { workplace = "hall",      requires = [], produces = [],                 role_weight = 0.6, enforcement = true }
priest       = { workplace = "shrine",    requires = [], produces = [],                 role_weight = 1.0, enforcement = false }
tutor        = { workplace = "school",    requires = ["literate"], produces = [],       role_weight = 0.4, enforcement = false }
historian    = { workplace = "none",      requires = ["literate"], produces = [],       role_weight = 0.6, enforcement = false }
cartographer = { workplace = "none",      requires = ["literate"], produces = [],       role_weight = 0.4, enforcement = false }
judge        = { workplace = "hall",      requires = ["literate"], produces = [],       role_weight = 1.0, enforcement = true }
steward      = { workplace = "hall",      requires = ["literate"], produces = [],       role_weight = 0.8, enforcement = true }
reeve        = { workplace = "hall",      requires = [], produces = [],                 role_weight = 0.6, enforcement = true }
lord         = { workplace = "manor",     requires = [], produces = [],                 role_weight = 2.0, enforcement = true }
bandit       = { workplace = "none",      requires = [], produces = [],                 role_weight = 0.5, enforcement = false }
vagrant      = { workplace = "none",      requires = [], produces = [],                 role_weight = 0.1, enforcement = false }

# ---------------------------------------------------------------- items
# kind: coin | food | material | tool | medium | livestock | vehicle
# weight per unit (kg). food units are food_unit_g each, so weight = food_unit_g/1000.
[items]
